<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สายพันธุ์ปลาน้ำจืดไทย | คลังความรู้ปลาน้ำจืดไทย</title>
  <meta name="description" content="รวมสายพันธุ์ปลาน้ำจืดไทย ค้นหาและกรองตามหมวดหมู่ ปลาเศรษฐกิจ ปลาหายาก ปลาพื้นเมือง พร้อมข้อมูลเชิงลึกรายชนิด">
  <meta name="theme-color" content="#0a4a54">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="site-nav"></div>

  <header class="page-hero">
    <div class="container">
      <nav class="breadcrumb" aria-label="เส้นทาง"><a href="index.html">หน้าแรก</a> / สายพันธุ์ปลา</nav>
      <h1>สายพันธุ์ปลาน้ำจืดไทย</h1>
      <p>เรียนรู้ลักษณะ ถิ่นอาศัย พฤติกรรม การสืบพันธุ์ และสถานะการอนุรักษ์ของปลาน้ำจืดไทยแต่ละชนิด</p>
    </div>
  </header>

  <section class="section">
    <div class="container">

      <div class="toolbar">
        <div class="filters" id="filters" role="group" aria-label="กรองตามหมวดหมู่">
          <button class="filter-btn active" data-cat="all">ทั้งหมด</button>
          <button class="filter-btn" data-cat="economic">🐟 ปลาเศรษฐกิจ</button>
          <button class="filter-btn" data-cat="rare">🛡️ ปลาหายาก/อนุรักษ์</button>
          <button class="filter-btn" data-cat="native">🌿 ปลาพื้นเมือง</button>
          <button class="filter-btn" data-cat="beautiful">✨ ปลาสวยงาม</button>
        </div>
        <div class="search-box">
          <label for="searchInput" class="visually-hidden" style="position:absolute;left:-9999px">ค้นหาปลา</label>
          <input type="search" id="searchInput" placeholder="ค้นหาชื่อไทย / อังกฤษ / ชื่อวิทยาศาสตร์...">
        </div>
      </div>

      <p class="result-count" id="resultCount"></p>

      <div class="species-grid" id="speciesGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        😔 ไม่พบสายพันธุ์ที่ตรงกับการค้นหา ลองเปลี่ยนคำค้นหรือหมวดหมู่ดูอีกครั้ง
      </div>

    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/species.js"></script>
</body>
</html>
